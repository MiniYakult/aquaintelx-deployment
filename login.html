<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AquaIntelX</title>
    <!-- Use Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Inline specific login styles */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at top right, rgba(0, 229, 255, 0.1), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.1), transparent 50%),
                        var(--bg-main);
        }
        
        [data-theme="light"] .login-page {
            background: radial-gradient(circle at top right, rgba(14, 165, 233, 0.1), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.1), transparent 50%),
                        var(--bg-main);
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 24px;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .brand-large {
            justify-content: center;
            margin-bottom: 16px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 15px;
        }
        
        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form .btn-primary {
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 16px;
            margin-top: 12px;
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        
        .form-footer a:hover {
            text-decoration: underline;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-group input {
            cursor: pointer;
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }



        .auth-switch {
            margin-top: 18px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .auth-switch a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .panel {
                padding: 24px !important;
            }
            .login-header .brand-text {
                font-size: 28px;
            }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="panel">
            <div class="login-header">
                <div class="brand-large">
                    <i class="ph ph-waves brand-icon" style="color: var(--primary);"></i>
                    <span class="brand-text">AquaIntelX</span>
                </div>
                <p>Sign in to access real-time telemetry</p>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="admin@aquaintelx.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <div class="form-footer">
                    <label class="checkbox-group">
                        <input type="checkbox" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="reset_password.html" id="forgot-password-link">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <i class="ph ph-sign-in"></i> Access Dashboard
                </button>
            </form>

            <div class="auth-switch">
                Need a user account? <a href="register.html">Create account</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Apply saved theme immediately to prevent flash
            const currentTheme = localStorage.getItem('theme') || 'dark';
            if (currentTheme === 'light') {
                document.body.setAttribute('data-theme', 'light');
            }

            const loginForm = document.getElementById('loginForm');
            const loginBtn  = document.getElementById('login-btn');
            const emailInput    = loginForm.querySelector('input[type="email"]');
            const passwordInput = loginForm.querySelector('input[type="password"]');

            // ── Error banner ─────────────────────────────────────
            function showError(msg) {
                let banner = document.getElementById('error-banner');
                if (!banner) {
                    banner = document.createElement('div');
                    banner.id = 'error-banner';
                    banner.style.cssText =
                        'background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);' +
                        'color:#f87171;padding:10px 14px;border-radius:8px;font-size:14px;' +
                        'margin-bottom:16px;display:flex;align-items:center;gap:8px;';
                    loginForm.insertBefore(banner, loginForm.firstChild);
                }
                banner.innerHTML = '<i class="ph ph-warning-circle"></i> ' + msg;
                banner.style.display = 'flex';
            }

            function showSuccess(msg) {
                let banner = document.getElementById('success-banner');
                if (!banner) {
                    banner = document.createElement('div');
                    banner.id = 'success-banner';
                    banner.style.cssText =
                        'background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);' +
                        'color:#34d399;padding:10px 14px;border-radius:8px;font-size:14px;' +
                        'margin-bottom:16px;display:flex;align-items:center;gap:8px;';
                    loginForm.insertBefore(banner, loginForm.firstChild);
                }
                banner.innerHTML = '<i class="ph ph-check-circle"></i> ' + msg;
                banner.style.display = 'flex';
            }

            function hideError() {
                const banner = document.getElementById('error-banner');
                if (banner) banner.style.display = 'none';
            }

            // Show session-timeout / registration messages after helpers are ready
            const params = new URLSearchParams(location.search);
            if (params.get('timeout') === '1') {
                showError('Your session expired. Please sign in again.');
            }

            if (params.get('created') === '1') {
                showSuccess('Account created successfully. You may now sign in.');
            }

            if (params.get('reset') === '1') {
                showSuccess('Password reset successfully. You may now sign in.');
            }

            const forgotLink = document.getElementById('forgot-password-link');
            if (forgotLink) {
                forgotLink.addEventListener('click', (event) => {
                    const email = emailInput.value.trim();
                    if (email) {
                        event.preventDefault();
                        window.location.href = 'reset_password.html?email=' + encodeURIComponent(email);
                    }
                });
            }

            // ── Submit ───────────────────────────────────────────
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();

                const email    = emailInput.value.trim();
                const password = passwordInput.value;

                // Loading state
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="ph ph-spinner-gap" style="animation:spin 1s linear infinite;"></i> Authenticating...';
                loginBtn.style.opacity = '0.8';

                try {
                    const res  = await fetch('login.php', {
                        method:  'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body:    JSON.stringify({ email, password }),
                    });

                    const responseText = await res.text();
                    let data;

                    try {
                        data = JSON.parse(responseText);
                    } catch (parseError) {
                        // This usually means login.php returned redirected HTML
                        // instead of JSON, often because an old session still exists.
                        if (res.redirected) {
                            window.location.href = res.url || 'index.php';
                            return;
                        }
                        throw new Error('Invalid server response from login.php');
                    }

                    if (data.success) {
                        // Success state
                        loginBtn.innerHTML = '<i class="ph ph-check"></i> Success';
                        loginBtn.style.opacity       = '1';
                        loginBtn.style.backgroundColor = 'var(--success)';
                        loginBtn.style.boxShadow       = '0 0 15px rgba(16,185,129,.4)';

                        setTimeout(() => {
                            window.location.href = data.redirect || 'index.php';
                        }, 500);
                    } else {
                        showError(data.message || 'Login failed. Please try again.');
                        // Reset button
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="ph ph-sign-in"></i> Access Dashboard';
                        loginBtn.style.opacity       = '1';
                        loginBtn.style.backgroundColor = '';
                        loginBtn.style.boxShadow       = '';
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                } catch (err) {
                    console.error(err);
                    showError('Login server returned an invalid response. Replace login.php with the fixed version and check that Apache/MySQL are running.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="ph ph-sign-in"></i> Access Dashboard';
                    loginBtn.style.opacity = '1';
                }
            });
        });
    </script>
</body>
</html>
