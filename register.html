<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AquaIntelX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css?v=register-scroll-fix">
    <style>
        html {
            min-height: 100%;
            overflow-y: auto;
        }

        body.login-page {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-height: 100vh;
            height: auto;
            overflow-x: hidden;
            overflow-y: auto !important;
            padding: 32px 24px 56px;
            background: radial-gradient(circle at top right, rgba(0, 229, 255, 0.1), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.1), transparent 50%),
                        var(--bg-main);
        }

        [data-theme="light"].login-page,
        [data-theme="light"] body.login-page {
            background: radial-gradient(circle at top right, rgba(14, 165, 233, 0.1), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.1), transparent 50%),
                        var(--bg-main);
        }

        .login-wrapper {
            width: 100%;
            max-width: 480px;
            z-index: 1;
            padding-bottom: 24px;
        }

        .panel {
            overflow: visible;
        }

        .login-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .login-header .brand-large {
            justify-content: center;
            margin-bottom: 16px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .login-form .form-group {
            margin-bottom: 16px;
        }

        .login-form .btn-primary {
            width: 100%;
            justify-content: center;
            padding: 13px;
            font-size: 16px;
            margin-top: 8px;
        }

        .auth-switch {
            margin-top: 18px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .auth-switch a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }


        .login-link-btn {
            width: 100%;
            min-height: 48px;
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .login-link-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .account-note {
            margin: -6px 0 18px;
            padding: 12px 14px;
            border-radius: 14px;
            background: var(--primary-dim);
            border: 1px solid rgba(0, 229, 255, 0.22);
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            body.login-page { padding: 18px 14px 48px; }
            .panel { padding: 24px !important; }
            .login-header .brand-text { font-size: 28px; }
            .login-link-btn { min-height: 46px; }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="panel">
            <div class="login-header">
                <div class="brand-large">
                    <i class="ph ph-waves brand-icon" style="color: var(--primary);"></i>
                    <span class="brand-text">AquaIntelX</span>
                </div>
                <p>Create a user account for dashboard access</p>
            </div>

            <div class="account-note">
                New accounts are created as <strong>Viewer</strong> accounts. They can sign in and view the AquaIntelX dashboard without becoming an administrator.
            </div>

            <form class="login-form" id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Juan Dela Cruz" maxlength="100" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="user@example.com" maxlength="100" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm_password" placeholder="Repeat password" minlength="8" required>
                </div>

                <button type="submit" class="btn btn-primary" id="register-btn">
                    <i class="ph ph-user-plus"></i> Create Account
                </button>

                <a href="login.html" class="login-link-btn">
                    <i class="ph ph-sign-in"></i> Back to Login
                </a>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = localStorage.getItem('theme') || 'dark';
            if (currentTheme === 'light') document.body.setAttribute('data-theme', 'light');

            const form = document.getElementById('registerForm');
            const btn = document.getElementById('register-btn');
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirm_password');

            function showBanner(type, msg) {
                let banner = document.getElementById('auth-banner');
                if (!banner) {
                    banner = document.createElement('div');
                    banner.id = 'auth-banner';
                    banner.style.cssText = 'padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:16px;display:flex;align-items:center;gap:8px;';
                    form.insertBefore(banner, form.firstChild);
                }

                if (type === 'success') {
                    banner.style.background = 'rgba(16,185,129,.15)';
                    banner.style.border = '1px solid rgba(16,185,129,.4)';
                    banner.style.color = '#34d399';
                    banner.innerHTML = '<i class="ph ph-check-circle"></i> ' + msg;
                } else {
                    banner.style.background = 'rgba(239,68,68,.15)';
                    banner.style.border = '1px solid rgba(239,68,68,.4)';
                    banner.style.color = '#f87171';
                    banner.innerHTML = '<i class="ph ph-warning-circle"></i> ' + msg;
                }
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const payload = {
                    name: nameInput.value.trim(),
                    email: emailInput.value.trim(),
                    password: passwordInput.value,
                    confirm_password: confirmInput.value
                };

                if (payload.password !== payload.confirm_password) {
                    showBanner('error', 'Passwords do not match.');
                    confirmInput.focus();
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<i class="ph ph-spinner-gap" style="animation:spin 1s linear infinite;"></i> Creating account...';
                btn.style.opacity = '0.8';

                try {
                    const res = await fetch('register.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();

                    if (data.success) {
                        showBanner('success', 'Account created. Redirecting to login...');
                        btn.innerHTML = '<i class="ph ph-check"></i> Created';
                        btn.style.opacity = '1';
                        btn.style.backgroundColor = 'var(--success)';
                        setTimeout(() => window.location.href = data.redirect || 'login.html?created=1', 700);
                    } else {
                        showBanner('error', data.message || 'Account creation failed.');
                        btn.disabled = false;
                        btn.innerHTML = '<i class="ph ph-user-plus"></i> Create Account';
                        btn.style.opacity = '1';
                    }
                } catch (err) {
                    showBanner('error', 'Could not reach the server. Check your connection.');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="ph ph-user-plus"></i> Create Account';
                    btn.style.opacity = '1';
                }
            });
        });
    </script>
</body>
</html>
