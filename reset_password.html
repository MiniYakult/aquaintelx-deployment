<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AquaIntelX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        html, body { min-height: 100%; }

        body.login-page {
            min-height: 100vh;
            height: auto;
            overflow-y: auto !important;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
            background: radial-gradient(circle at top right, rgba(0, 229, 255, 0.1), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.1), transparent 50%),
                        var(--bg-main);
        }

        [data-theme="light"] body.login-page,
        body.login-page[data-theme="light"] {
            background: radial-gradient(circle at top right, rgba(14, 165, 233, 0.1), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.1), transparent 50%),
                        var(--bg-main);
        }

        .login-wrapper {
            width: 100%;
            max-width: 540px;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header .brand-large {
            justify-content: center;
            margin-bottom: 14px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .login-form .form-group { margin-bottom: 18px; }

        .login-form .btn-primary {
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 16px;
            margin-top: 8px;
        }

        .reset-note {
            margin: -4px 0 20px;
            padding: 14px 16px;
            border-radius: 14px;
            background: var(--primary-dim);
            border: 1px solid rgba(0, 229, 255, 0.22);
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.55;
        }

        .reset-step {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .step-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-dim);
            color: var(--primary);
            border: 1px solid rgba(0, 229, 255, 0.35);
            font-size: 12px;
        }

        .verification-section {
            display: none;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }

        .verification-section.active { display: block; }

        .code-input {
            letter-spacing: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
        }

        .secondary-action-row {
            display: flex;
            gap: 12px;
            margin-top: 14px;
        }

        .login-link-btn,
        .secondary-btn {
            width: 100%;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .login-link-btn:hover,
        .secondary-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .secondary-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 480px) {
            body.login-page { align-items: flex-start; padding: 20px 14px 48px; }
            .panel { padding: 24px !important; }
            .login-header .brand-text { font-size: 28px; }
            .secondary-action-row { flex-direction: column; }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="panel">
            <div class="login-header">
                <div class="brand-large">
                    <i class="ph ph-waves brand-icon" style="color: var(--primary);"></i>
                    <span class="brand-text">AquaIntelX</span>
                </div>
                <p>Reset your dashboard account password securely</p>
            </div>

            <div class="reset-note">
                Enter your registered email first. AquaIntelX will send a 6-digit verification code to that email before allowing the password change.
            </div>

            <form class="login-form" id="resetForm">
                <div class="reset-step">
                    <span class="step-dot">1</span>
                    Email verification
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="admin@aquaintelx.com" maxlength="100" required>
                </div>

                <button type="button" class="btn btn-primary" id="send-code-btn">
                    <i class="ph ph-paper-plane-tilt"></i> Send Verification Code
                </button>

                <div class="verification-section" id="verification-section">
                    <div class="reset-step">
                        <span class="step-dot">2</span>
                        Reset password
                    </div>

                    <div class="form-group">
                        <label>Verification Code</label>
                        <input type="text" id="code" class="code-input" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                    </div>

                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8">
                    </div>

                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" id="confirm_password" placeholder="Repeat new password" minlength="8">
                    </div>

                    <button type="submit" class="btn btn-primary" id="reset-btn">
                        <i class="ph ph-key"></i> Reset Password
                    </button>
                </div>

                <div class="secondary-action-row">
                    <button type="button" class="secondary-btn" id="resend-btn" style="display:none;">
                        <i class="ph ph-arrow-clockwise"></i> Resend Code
                    </button>
                    <a href="login.html" class="login-link-btn">
                        <i class="ph ph-sign-in"></i> Back to Login
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = localStorage.getItem('theme') || 'dark';
            if (currentTheme === 'light') document.body.setAttribute('data-theme', 'light');

            const form = document.getElementById('resetForm');
            const sendBtn = document.getElementById('send-code-btn');
            const resetBtn = document.getElementById('reset-btn');
            const resendBtn = document.getElementById('resend-btn');
            const emailInput = document.getElementById('email');
            const codeInput = document.getElementById('code');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirm_password');
            const verificationSection = document.getElementById('verification-section');

            const params = new URLSearchParams(location.search);
            const prefilledEmail = params.get('email');
            if (prefilledEmail) emailInput.value = prefilledEmail;

            function showBanner(type, msg) {
                let banner = document.getElementById('auth-banner');
                if (!banner) {
                    banner = document.createElement('div');
                    banner.id = 'auth-banner';
                    banner.style.cssText = 'padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:16px;display:flex;align-items:center;gap:8px;';
                    form.insertBefore(banner, form.firstChild);
                }

                if (type === 'success') {
                    banner.style.background = 'rgba(16,185,129,.15)';
                    banner.style.border = '1px solid rgba(16,185,129,.4)';
                    banner.style.color = '#34d399';
                    banner.innerHTML = '<i class="ph ph-check-circle"></i> ' + msg;
                } else {
                    banner.style.background = 'rgba(239,68,68,.15)';
                    banner.style.border = '1px solid rgba(239,68,68,.4)';
                    banner.style.color = '#f87171';
                    banner.innerHTML = '<i class="ph ph-warning-circle"></i> ' + msg;
                }
            }

            function setButtonLoading(btn, loading, defaultHtml, loadingHtml) {
                btn.disabled = loading;
                btn.innerHTML = loading ? loadingHtml : defaultHtml;
                btn.style.opacity = loading ? '0.8' : '1';
            }

            async function requestCode() {
                const email = emailInput.value.trim();
                if (!email) {
                    showBanner('error', 'Please enter your registered email address.');
                    emailInput.focus();
                    return;
                }

                setButtonLoading(
                    sendBtn,
                    true,
                    '<i class="ph ph-paper-plane-tilt"></i> Send Verification Code',
                    '<i class="ph ph-spinner-gap" style="animation:spin 1s linear infinite;"></i> Sending Code...'
                );

                try {
                    const res = await fetch('reset_password.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'request_code', email })
                    });

                    const data = await res.json();

                    if (data.success) {
                        showBanner('success', data.message || 'Verification code sent.');
                        verificationSection.classList.add('active');
                        resendBtn.style.display = 'flex';
                        codeInput.focus();
                        sendBtn.innerHTML = '<i class="ph ph-check"></i> Code Sent';
                        sendBtn.disabled = true;
                        setTimeout(() => {
                            sendBtn.disabled = false;
                            sendBtn.innerHTML = '<i class="ph ph-paper-plane-tilt"></i> Send Another Code';
                        }, 60000);
                    } else {
                        showBanner('error', data.message || 'Could not send verification code.');
                        setButtonLoading(sendBtn, false, '<i class="ph ph-paper-plane-tilt"></i> Send Verification Code', '');
                    }
                } catch (err) {
                    console.error(err);
                    showBanner('error', 'Could not reach reset_password.php. Check Railway deployment, database, and SMTP variables.');
                    setButtonLoading(sendBtn, false, '<i class="ph ph-paper-plane-tilt"></i> Send Verification Code', '');
                }
            }

            sendBtn.addEventListener('click', requestCode);
            resendBtn.addEventListener('click', requestCode);

            codeInput.addEventListener('input', () => {
                codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const payload = {
                    action: 'reset_password',
                    email: emailInput.value.trim(),
                    code: codeInput.value.trim(),
                    password: passwordInput.value,
                    confirm_password: confirmInput.value
                };

                if (!/^\d{6}$/.test(payload.code)) {
                    showBanner('error', 'Enter the 6-digit verification code sent to your email.');
                    codeInput.focus();
                    return;
                }

                if (payload.password.length < 8) {
                    showBanner('error', 'New password must be at least 8 characters.');
                    passwordInput.focus();
                    return;
                }

                if (payload.password !== payload.confirm_password) {
                    showBanner('error', 'Passwords do not match.');
                    confirmInput.focus();
                    return;
                }

                setButtonLoading(
                    resetBtn,
                    true,
                    '<i class="ph ph-key"></i> Reset Password',
                    '<i class="ph ph-spinner-gap" style="animation:spin 1s linear infinite;"></i> Resetting...'
                );

                try {
                    const res = await fetch('reset_password.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();

                    if (data.success) {
                        showBanner('success', data.message || 'Password reset successfully. Redirecting to login...');
                        resetBtn.innerHTML = '<i class="ph ph-check"></i> Password Reset';
                        resetBtn.style.opacity = '1';
                        resetBtn.style.backgroundColor = 'var(--success)';
                        setTimeout(() => window.location.href = data.redirect || 'login.html?reset=1', 1000);
                    } else {
                        showBanner('error', data.message || 'Password reset failed.');
                        setButtonLoading(resetBtn, false, '<i class="ph ph-key"></i> Reset Password', '');
                    }
                } catch (err) {
                    console.error(err);
                    showBanner('error', 'Could not reach reset_password.php. Check Railway deployment, database, and SMTP variables.');
                    setButtonLoading(resetBtn, false, '<i class="ph ph-key"></i> Reset Password', '');
                }
            });
        });
    </script>
</body>
</html>
